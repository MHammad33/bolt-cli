name: Feature
description: Something bolt should be able to do
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this add, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks that mean this is done.
      placeholder: |
        - [ ] `bolt ask "hello"` prints a streamed response
        - [ ] Exits with code 0
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach / notes
      description: Rough implementation idea, open questions, useful links.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - S (a few hours)
        - M (about a day)
        - L (2-3 days, consider splitting)
    validations:
      required: true
